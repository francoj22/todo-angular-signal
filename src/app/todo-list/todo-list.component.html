@if (todos().length === 0) {
  <p class="empty-state">No tasks here yet. Add one to get momentum.</p>
} @else {
  <ul class="todo-list">
    @for (todo of todos(); track todo.id) {
      <li [class.completed]="todo.completed">
        <label>
          <input
            type="checkbox"
            [checked]="todo.completed"
            (change)="onToggle(todo.id)"
            [attr.aria-label]="'Mark ' + todo.text + ' as completed'"
          />
          <span>{{ todo.text }}</span>
        </label>
        <button
          type="button"
          class="delete"
          (click)="onRemove(todo.id)"
          [attr.aria-label]="'Delete ' + todo.text"
        >
          Delete
        </button>
      </li>
    }
  </ul>
}
