apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-angular-signal
  labels:
    app: todo-angular-signal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-angular-signal
  template:
    metadata:
      labels:
        app: todo-angular-signal
    spec:
      containers:
        - name: todo-angular-signal
          image: my-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
