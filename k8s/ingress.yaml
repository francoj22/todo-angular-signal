apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-angular-signal
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: todo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-angular-signal
                port:
                  number: 80
