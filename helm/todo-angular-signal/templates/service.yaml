apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-angular-signal.fullname" . }}
  labels:
    {{- include "todo-angular-signal.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "todo-angular-signal.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
